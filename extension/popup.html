<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #030712;
      color: #e5e7eb;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #a78bfa;
      margin-bottom: 16px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="time"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
    }
    input:focus {
      border-color: #8b5cf6;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .toggle-row span {
      font-size: 13px;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #374151;
      border-radius: 22px;
      transition: 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: #e5e7eb;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle input:checked + .slider {
      background: #8b5cf6;
    }
    .toggle input:checked + .slider::before {
      transform: translateX(18px);
    }
    button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #8b5cf6;
      color: white;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background: #7c3aed;
    }
    .status {
      font-size: 11px;
      color: #6b7280;
      text-align: center;
      margin-top: 8px;
    }
    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }
  </style>
</head>
<body>
  <h1>Day Rating Reminder</h1>

  <div class="field">
    <label>Supabase URL</label>
    <input type="text" id="supabaseUrl" placeholder="https://xxx.supabase.co">
  </div>

  <div class="field">
    <label>Supabase Anon Key</label>
    <input type="password" id="supabaseKey" placeholder="sb_publishable_...">
  </div>

  <div class="field">
    <label>Remind at</label>
    <input type="time" id="reminderTime">
  </div>

  <div class="toggle-row">
    <span>Notifications</span>
    <label class="toggle">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <button id="testBtn">Test Connection</button>
  <button id="testNotifBtn" style="margin-top: 6px; background: #374151;">Send Test Notification</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
